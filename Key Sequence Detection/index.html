<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Key Detection</title>
    <script type="text/javascript" src="./cornify.js"></script>
    <link rel="icon" href="https://fav.farm/🔥" />
  </head>
  <body>
    <p
      style="
        font-size: large;
        display: flex;
        justify-content: center;
        align-items: center;
      "
    >
      Press <kbd style="margin: 5px">rkbhsn</kbd> and you will be cornified!!
    </p>

    <script>
      const secretCode = "rkbhsn";
      const pressed = [];

      window.addEventListener("keydown", (e) => {
        console.log(e.key);

        if (!/^[a-zA-Z]$/.test(e.key)) {
          return; //if not alphabet return
        }

        pressed.push(e.key);

        pressed.splice(
          -secretCode.length - 1,
          pressed.length - secretCode.length,
        );
        console.log(pressed);
        if (pressed.join("").includes(secretCode)) {
          console.log("found");
          cornify_add();
        }
      });
    </script>
  </body>
</html>
